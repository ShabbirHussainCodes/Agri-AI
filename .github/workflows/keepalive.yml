# Keeps the free Supabase project from being paused for inactivity and wakes the free
# Hugging Face Space. /health/db runs one trivial query against agriai-db.
# Needs one repository variable: AGRIAI_API_URL (e.g. https://<user>-agriai-api.hf.space).
# UNTESTED until it has run once on GitHub: check the Actions tab after the first schedule.
name: keepalive
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the API and the database behind it
        env:
          API_URL: ${{ vars.AGRIAI_API_URL }}
        run: |
          test -n "$API_URL" || { echo "Set the AGRIAI_API_URL repository variable"; exit 1; }
          curl --fail --silent --show-error --retry 5 --retry-delay 20 --retry-all-errors \
               --max-time 120 "$API_URL/health/db"
