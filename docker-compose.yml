# Local development database only. Never used in production/deployment.
# Mirrors Supabase's Postgres major version (17) for dev/prod parity.
# See docs/backend/backend-architecture.md and db/README.md.
services:
  db:
    image: pgvector/pgvector:pg17
    container_name: agriai-local-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: agriai
      POSTGRES_PASSWORD: agriai_local_dev_only
      POSTGRES_DB: agriai
    ports:
      # Non-default host port (54322) to avoid clashing with any existing
      # local Postgres install. Only reachable from this machine.
      - "54322:5432"
    volumes:
      - agriai_pg_data:/var/lib/postgresql/data

volumes:
  agriai_pg_data:
